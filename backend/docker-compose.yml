version: '3.9'

services:
  backend:
    build:
      context: ./backendsolar
      dockerfile: Dockerfile
    image: solar-agent-backend:latest
    container_name: solar-agent-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: production
      NASA_API_BASE_URL: ${NASA_API_BASE_URL:-https://power.larc.nasa.gov/api}
      NASA_LATITUDE: ${NASA_LATITUDE:-11.5444}
      NASA_LONGITUDE: ${NASA_LONGITUDE:--72.9072}
      NASA_COMMUNITY: ${NASA_COMMUNITY:-RE}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-235b-a22b}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CACHE_TTL: ${CACHE_TTL:-3600}
      # YCloud / WhatsApp
      YCLOUD_API_KEY: ${YCLOUD_API_KEY}
      YCLOUD_BASE_URL: ${YCLOUD_BASE_URL:-https://api.ycloud.com/v2}
      YCLOUD_ENABLED: ${YCLOUD_ENABLED:-true}
      YCLOUD_WHATSAPP_NUMBER: ${YCLOUD_WHATSAPP_NUMBER}
      WHATSAPP_COMPANY_PHONE: ${WHATSAPP_COMPANY_PHONE}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: solar-agent-frontend:latest
    container_name: solar-agent-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001}
    depends_on:
      backend:
        condition: service_healthy
